[build]
  command   = "npm run setup && npm run build"
  publish   = "client/dist"

[functions]
  directory            = "netlify/functions"
  external_node_modules = ["better-sqlite3"]

[[redirects]]
  from     = "/api/*"
  to       = "/.netlify/functions/api/:splat"
  status   = 200
  force    = true

[[redirects]]
  from     = "/uploads/*"
  to       = "/.netlify/functions/api/uploads/:splat"
  status   = 200
  force    = true

# SPA fallback — must be last
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
