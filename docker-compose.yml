services:
  wedding:
    build: .
    ports:
      - "4000:4000"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      SESSION_SECRET: ${SESSION_SECRET:-replace-with-a-long-random-string}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - wedding-data:/data
    restart: unless-stopped

volumes:
  wedding-data:
